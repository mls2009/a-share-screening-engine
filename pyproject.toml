[project]
name = "astock"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "akshare>=1.18",
  "baostock>=0.9.3",
  "duckdb>=1.3",
  "fastapi>=0.110,<0.116",
  "mootdx>=0.11.7",
  "pandas>=2.2",
  "pyarrow>=18",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.25,<0.26", "pytest>=8.3", "pytest-cov>=6", "ruff>=0.9"]

[project.scripts]
astock = "astock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
